global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty'
    - match:
        severity: high
      receiver: 'oncall'
    - match:
        severity: warning
      receiver: 'slack'

receivers:
  - name: 'default'
    email_configs:
      - to: 'ops@example.com'
  - name: 'pagerduty'
    pagerduty_configs:
      - service_key: '<PAGERDUTY_SERVICE_KEY>'
  - name: 'oncall'
    webhook_configs:
      - url: 'https://hooks.example.com/oncall'
  - name: 'slack'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/TOKEN'
        channel: '#alerts'

# Note: replace placeholders with actual receiver configuration and secrets.
# Ensure credentials are stored securely (not in plaintext in repo) and use secret management for real deployments.
