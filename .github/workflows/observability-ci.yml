name: Observability stack CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-test-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and start observability stack
        run: |
          docker compose up --build -d --remove-orphans

      - name: Wait for observability to be available
        run: |
          for i in {1..30}; do
            if curl -sS http://localhost:9700/metrics >/dev/null 2>&1; then
              echo "observability up"
              break
            fi
            sleep 2
          done

      - name: Pre-check: ensure no existing critical alerts
        run: |
          set -e
          Q1='increase(lh_refresh_token_revoke_all[5m]) == 0'
          Q2='increase(lh_rate_limit_429[5m]) == 0'
          echo "Pre-check queries: $Q1 and $Q2"
          RES1=$(curl -sS --data-urlencode "query=$Q1" http://localhost:9090/api/v1/query)
          RES2=$(curl -sS --data-urlencode "query=$Q2" http://localhost:9090/api/v1/query)
          echo "$RES1" | jq .
          echo "$RES2" | jq .
          # if either returns results, fail
          C1=$(echo "$RES1" | jq '.data.result | length')
          C2=$(echo "$RES2" | jq '.data.result | length')
          if [ "$C1" -gt 0 ] || [ "$C2" -gt 0 ]; then echo "Existing alerts detected before test start"; exit 1; fi

      - name: Exercise endpoints
        run: |
          curl -sS http://localhost:9700/login
          curl -sS http://localhost:9700/create || true
          curl -sS http://localhost:9700/create || true
          curl -sS http://localhost:9700/join
          curl -sS http://localhost:9700/simulate-refresh

      - name: Fetch metrics
        run: curl -sS http://localhost:9700/metrics | head -n 200

      - name: Install jq for Prometheus queries
        run: sudo apt-get update && sudo apt-get install -y jq || true

      - name: Check AnyRefreshTokenRevokeAll fired (should be > 0 after simulation)
        run: |
          set -e
          Q='increase(lh_refresh_token_revoke_all[5m]) > 0'
          echo "Query: $Q"
          sleep 5
          RES=$(curl -sS --data-urlencode "query=$Q" http://localhost:9090/api/v1/query)
          echo "$RES" | jq .
          COUNT=$(echo "$RES" | jq '.data.result | length')
          if [ "$COUNT" -lt 1 ]; then echo "Expected AnyRefreshTokenRevokeAll to be active"; exit 1; fi

      - name: Check RateLimit for create-test (should be > 0)
        run: |
          set -e
          Q='increase(lh_rate_limit_429{route="create-test"}[5m]) > 0'
          echo "Query: $Q"
          sleep 2
          RES=$(curl -sS --data-urlencode "query=$Q" http://localhost:9090/api/v1/query)
          echo "$RES" | jq .
          COUNT=$(echo "$RES" | jq '.data.result | length')
          if [ "$COUNT" -lt 1 ]; then echo "Expected rate limit hit for create-test"; exit 1; fi

      - name: Tear down
        if: always()
        run: docker compose down -v
